<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LF Counter Ops</title>
<style>
:root{
  --bg:#F6F5F0;
  --surface:#FFFFFF;
  --line:#DEDACD;
  --ink:#22261F;
  --ink-soft:#5C6154;
  --brass:#8B6F2E;
  --brass-soft:#EFE6CE;
  --good:#33633F;
  --good-soft:#E4EFE3;
  --bad:#96392A;
  --bad-soft:#F5E4DF;
  --sidebar:#1E2119;
  --sidebar-ink:#D9D6C7;
  --sidebar-line:#33372B;
  --radius:3px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
}
#shell{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:224px;flex:0 0 224px;background:var(--sidebar);color:var(--sidebar-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
#brand{padding:22px 20px 16px;border-bottom:1px solid var(--sidebar-line);}
#brand .mark{font-size:11px;letter-spacing:.04em;color:#B7A567;margin-bottom:2px;}
#brand h1{font-size:18px;margin:0;font-weight:600;color:#F3F1E6;}
#brand .sub{font-size:12px;color:#8D9080;margin-top:3px;}
nav{flex:1;padding:10px 0;overflow-y:auto;}
nav button{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--sidebar-ink);padding:10px 20px;font-size:13.5px;cursor:pointer;
  border-left:3px solid transparent;font-family:var(--font);
}
nav button:hover{background:#272B20;}
nav button.active{background:#272B20;border-left-color:var(--brass);color:#F3F1E6;font-weight:600;}
#savebox{padding:14px 18px 18px;border-top:1px solid var(--sidebar-line);}
#savebox .status{font-size:11.5px;color:#8D9080;margin-bottom:8px;min-height:14px;}
#savebox .status.dirty{color:#D8B25A;}
.btn{
  display:inline-block;padding:8px 14px;border-radius:var(--radius);border:1px solid transparent;
  font-size:13px;cursor:pointer;font-family:var(--font);font-weight:600;
}
.btn-brass{background:var(--brass);color:#fff;}
.btn-brass:hover{background:#7A5F26;}
.btn-outline{background:transparent;border-color:#4A4E3F;color:#E4E1D2;}
.btn-outline:hover{background:#272B20;}
.btn-block{display:block;width:100%;margin-bottom:8px;text-align:center;}

/* Main */
#main{flex:1;padding:28px 36px 60px;max-width:1180px;}
h2.page-title{font-size:21px;margin:0 0 4px;font-weight:600;}
p.page-sub{color:var(--ink-soft);margin:0 0 22px;font-size:13.5px;}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.kpi .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
.kpi .value{font-size:22px;font-weight:700;}
.kpi .delta{font-size:12px;margin-top:4px;}
.kpi .delta.up{color:var(--good);}
.kpi .delta.down{color:var(--bad);}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
.panel h3{font-size:14.5px;margin:0 0 14px;font-weight:600;}
.panel-flex{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:900px){.panel-flex{grid-template-columns:1fr;}}

form.entry-form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11.5px;color:var(--ink-soft);}
.field input,.field select,.field textarea{
  font-family:var(--font);font-size:13px;padding:7px 9px;border:1px solid var(--line);
  border-radius:var(--radius);background:#fff;min-width:130px;color:var(--ink);
}
.field textarea{min-width:220px;}
.field.chk{flex-direction:row;align-items:center;gap:6px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:600;}
tbody tr:hover{background:#FAF9F3;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.tag.good{background:var(--good-soft);color:var(--good);}
.tag.bad{background:var(--bad-soft);color:var(--bad);}
.tag.neutral{background:var(--brass-soft);color:var(--brass);}
.rowlink{background:none;border:none;color:var(--brass);cursor:pointer;font-size:12.5px;font-weight:600;padding:0;margin-right:10px;font-family:var(--font);}
.rowlink.danger{color:var(--bad);}
.empty{color:var(--ink-soft);font-style:italic;padding:16px 0;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:8px;}
.banner{background:var(--brass-soft);border:1px solid #DDCB94;color:#6B5220;border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:20px;}
.banner b{display:block;margin-bottom:2px;}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div id="brand">
      <div class="mark">COUNTER OPERATIONS</div>
      <h1>LF Ops</h1>
      <div class="sub">Lifestyle counters &middot; imitation jewellery</div>
    </div>
    <nav id="navlist"></nav>
    <div id="savebox">
      <div class="status" id="dirtyStatus"></div>
      <button class="btn btn-brass btn-block" onclick="saveDatabase()">Save database (.sqlite)</button>
      <label class="btn btn-outline btn-block" style="cursor:pointer;">
        Load database
        <input type="file" id="loadFileInput" accept=".sqlite,.db" style="display:none;">
      </label>
      <button class="btn btn-outline btn-block" onclick="exportSQL()" style="font-weight:400;font-size:12px;">Export as .sql</button>
      <button class="btn btn-outline btn-block" onclick="exportJSON()" style="font-weight:400;font-size:12px;">Export as .json</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ STATE ============ */
let db = null;
let dirty = false;
let activeTab = 'dashboard';
let editing = {}; // per-entity id being edited
let charts = {};  // active Chart.js instances to destroy on re-render

const TABS = [
  {id:'dashboard', label:'Dashboard'},
  {id:'stores', label:'Stores'},
  {id:'employees', label:'Employees'},
  {id:'sales', label:'Daily Sales'},
  {id:'audits', label:'Display Stock / Shrinkage'},
  {id:'visits', label:'Staffed vs Unstaffed'},
  {id:'status', label:'Employee Status Log'},
  {id:'storecontacts', label:'Store Contacts'},
  {id:'soh', label:'Stock on Hand'},
  {id:'import', label:'Bulk Import'},
  {id:'customfields', label:'Custom Fields'},
];

/* ============ INIT ============ */
let SQLLib = null;
initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` })
  .then(SQL => {
    SQLLib = SQL;
    db = new SQL.Database();
    createSchema();
    ensureSchemaMigrations();
    buildNav();
    render();
  })
  .catch(err => {
    document.getElementById('main').innerHTML =
      `<div class="banner"><b>Could not load the database engine.</b>This app needs an internet connection the first time it runs (to fetch sql.js), then works fully offline in your browser. Error: ${esc(err.message||err)}</div>`;
  });

function createSchema(){
  db.exec(`
    CREATE TABLE stores(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      concept TEXT DEFAULT 'LF',
      store_code TEXT,
      store_name TEXT NOT NULL,
      area_name TEXT,
      region_name TEXT,
      district_name TEXT,
      store_type TEXT,
      active INTEGER DEFAULT 1
    );
    CREATE TABLE employees(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      name TEXT NOT NULL,
      store_id INTEGER,
      designation TEXT,
      status TEXT DEFAULT 'Active',
      join_date TEXT,
      mobile TEXT,
      salary REAL,
      salary_remark TEXT,
      notes TEXT
    );
    CREATE TABLE store_contacts(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      store_id INTEGER,
      contact_name TEXT,
      contact_role TEXT,
      mobile TEXT,
      email TEXT,
      address TEXT,
      notes TEXT
    );
    CREATE TABLE categories(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      name TEXT UNIQUE NOT NULL
    );
    CREATE TABLE daily_sales(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      sale_date TEXT NOT NULL,
      store_id INTEGER,
      employee_id INTEGER,
      category_id INTEGER,
      qty REAL DEFAULT 0,
      mrp_value REAL DEFAULT 0,
      discount REAL DEFAULT 0,
      net_value REAL DEFAULT 0,
      remarks TEXT
    );
    CREATE TABLE stock_audits(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      audit_date TEXT NOT NULL,
      store_id INTEGER,
      category_id INTEGER,
      system_qty REAL DEFAULT 0,
      counted_qty REAL DEFAULT 0,
      shrinkage_qty REAL DEFAULT 0,
      damage_qty REAL DEFAULT 0,
      counted_by TEXT,
      remarks TEXT
    );
    CREATE TABLE counter_visits(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      visit_date TEXT NOT NULL,
      store_id INTEGER,
      staffed INTEGER NOT NULL DEFAULT 1,
      employee_id INTEGER,
      sales_value REAL DEFAULT 0,
      qty_sold REAL DEFAULT 0,
      shrinkage_qty REAL DEFAULT 0,
      damage_qty REAL DEFAULT 0,
      notes TEXT
    );
    CREATE TABLE employee_status_log(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      employee_id INTEGER,
      log_date TEXT NOT NULL,
      status TEXT NOT NULL,
      attendance TEXT,
      notes TEXT
    );
    CREATE TABLE soh_snapshot(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      snapshot_date TEXT NOT NULL,
      store_id INTEGER,
      category_id INTEGER,
      item_code TEXT,
      item_desc TEXT,
      soh_qty REAL DEFAULT 0,
      mrp REAL DEFAULT 0
    );
    CREATE INDEX idx_soh_date ON soh_snapshot(snapshot_date);
    CREATE INDEX idx_sales_date ON daily_sales(sale_date);
    CREATE TABLE upload_logs(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      file_name TEXT,
      file_size INTEGER,
      file_hash TEXT UNIQUE,
      target TEXT,
      rows_inserted INTEGER,
      rows_skipped INTEGER,
      uploaded_at TEXT
    );
    CREATE TABLE custom_fields(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      entity TEXT NOT NULL,
      field_label TEXT NOT NULL,
      field_type TEXT NOT NULL DEFAULT 'text',
      options TEXT,
      sort_order INTEGER DEFAULT 0
    );
    CREATE TABLE custom_field_values(
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      field_id INTEGER NOT NULL,
      record_id INTEGER NOT NULL,
      value TEXT
    );
    CREATE INDEX idx_cfv_lookup ON custom_field_values(field_id, record_id);
  `);
  const seedCats = ['Earrings','Chains','Necklace','Anklet','Bracelet','Bangles','Finger Ring','Others'];
  const stmt = db.prepare('INSERT INTO categories(name) VALUES (?)');
  seedCats.forEach(c => stmt.run([c]));
  stmt.free();
  dirty = false;
}

function ensureSchemaMigrations(){
  try{
    const cols = q("PRAGMA table_info(employee_status_log)").map(c=>c.name);
    if(!cols.includes('attendance')){
      db.exec("ALTER TABLE employee_status_log ADD COLUMN attendance TEXT");
    }
  }catch(e){ /* fresh db already has the column; ignore */ }
  try{
    const cols = q("PRAGMA table_info(employees)").map(c=>c.name);
    if(!cols.includes('mobile')) db.exec("ALTER TABLE employees ADD COLUMN mobile TEXT");
    if(!cols.includes('salary')) db.exec("ALTER TABLE employees ADD COLUMN salary REAL");
    if(!cols.includes('salary_remark')) db.exec("ALTER TABLE employees ADD COLUMN salary_remark TEXT");
  }catch(e){ /* fresh db already has these columns; ignore */ }
  try{
    const tables = q("SELECT name FROM sqlite_master WHERE type='table' AND name='store_contacts'");
    if(!tables.length){
      db.exec(`CREATE TABLE store_contacts(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        store_id INTEGER,
        contact_name TEXT,
        contact_role TEXT,
        mobile TEXT,
        email TEXT,
        address TEXT,
        notes TEXT
      )`);
    }
  }catch(e){ /* ignore */ }
  try{
    const tables = q("SELECT name FROM sqlite_master WHERE type='table' AND name='custom_fields'");
    if(!tables.length){
      db.exec(`CREATE TABLE custom_fields(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        entity TEXT NOT NULL,
        field_label TEXT NOT NULL,
        field_type TEXT NOT NULL DEFAULT 'text',
        options TEXT,
        sort_order INTEGER DEFAULT 0
      )`);
      db.exec(`CREATE TABLE custom_field_values(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        field_id INTEGER NOT NULL,
        record_id INTEGER NOT NULL,
        value TEXT
      )`);
      db.exec(`CREATE INDEX idx_cfv_lookup ON custom_field_values(field_id, record_id)`);
    }
  }catch(e){ /* ignore */ }
}

/* ============ DB HELPERS ============ */
function q(sql, params=[]){
  const stmt = db.prepare(sql);
  if(params.length) stmt.bind(params);
  const out=[];
  while(stmt.step()) out.push(stmt.getAsObject());
  stmt.free();
  return out;
}
function run(sql, params=[]){
  const stmt = db.prepare(sql);
  stmt.run(params);
  stmt.free();
  dirty = true;
  updateDirtyStatus();
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function rowAttr(r){ return JSON.stringify(r).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/</g,'&lt;'); }

/* ============ CUSTOM FIELDS (no-code add/remove fields per tab) ============ */
const CUSTOM_ENTITIES = {
  stores: 'Stores',
  employees: 'Employees',
  daily_sales: 'Daily Sales',
  stock_audits: 'Display Stock / Shrinkage',
  counter_visits: 'Staffed vs Unstaffed',
  employee_status_log: 'Employee Status Log',
  store_contacts: 'Store Contacts'
};
function getCustomFields(entity){ return q('SELECT * FROM custom_fields WHERE entity=? ORDER BY sort_order, id', [entity]); }
function customFieldInputHtml(field, value){
  const val = (value===undefined||value===null) ? '' : value;
  if(field.field_type==='select'){
    const opts = (field.options||'').split(',').map(o=>o.trim()).filter(Boolean);
    return `<select name="cf_${field.id}"><option value="">—</option>${opts.map(o=>`<option ${String(val)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if(field.field_type==='number') return `<input type="number" step="0.01" name="cf_${field.id}" value="${esc(val)}">`;
  if(field.field_type==='date') return `<input type="date" name="cf_${field.id}" value="${esc(val)}">`;
  return `<input type="text" name="cf_${field.id}" value="${esc(val)}">`;
}
function getRecordCustomValues(entity, recordId){
  if(!recordId) return {};
  const fields = getCustomFields(entity);
  if(!fields.length) return {};
  const rows = q(`SELECT field_id, value FROM custom_field_values WHERE record_id=? AND field_id IN (${fields.map(f=>f.id).join(',')})`, [recordId]);
  const map = {}; rows.forEach(r=> map[r.field_id]=r.value); return map;
}
function customFieldsFormHtml(entity, recordId){
  const fields = getCustomFields(entity);
  if(!fields.length) return '';
  const vals = getRecordCustomValues(entity, recordId);
  return fields.map(f=>`<div class="field"><label>${esc(f.field_label)}</label>${customFieldInputHtml(f, vals[f.id])}</div>`).join('');
}
function customFieldsTableHeaders(entity){
  return getCustomFields(entity).map(f=>`<th>${esc(f.field_label)}</th>`).join('');
}
function customFieldsTableCells(entity, recordId){
  const fields = getCustomFields(entity);
  if(!fields.length) return '';
  const vals = getRecordCustomValues(entity, recordId);
  return fields.map(f=>`<td>${esc(vals[f.id])||'—'}</td>`).join('');
}
function saveCustomFieldValues(entity, recordId, formData){
  getCustomFields(entity).forEach(f=>{
    const val = formData.get('cf_'+f.id);
    const existing = q('SELECT id FROM custom_field_values WHERE field_id=? AND record_id=?', [f.id, recordId]);
    if(existing.length){ run('UPDATE custom_field_values SET value=? WHERE id=?', [val, existing[0].id]); }
    else if(val!==null && val!==''){ run('INSERT INTO custom_field_values(field_id,record_id,value) VALUES (?,?,?)', [f.id, recordId, val]); }
  });
}
function newRecordId(){ return q('SELECT last_insert_rowid() id')[0].id; }
function fmtN(n,dec=0){ n=Number(n)||0; return n.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

function updateDirtyStatus(){
  const el = document.getElementById('dirtyStatus');
  if(!el) return;
  el.textContent = dirty ? 'Unsaved changes — click Save' : 'All changes saved to this session';
  el.className = 'status' + (dirty ? ' dirty' : '');
}

/* ============ CONTENT FINGERPRINT (duplicate-file detection) ============ */
// Fast, dependency-free hash (cyrb53-style) — used only to spot re-uploads of the
// same file, not for security. Works from file:// pages where Web Crypto may not.
function fingerprintBytes(bytes){
  let h1 = 0xdeadbeef ^ bytes.length, h2 = 0x41c6ce57 ^ bytes.length;
  for(let i=0;i<bytes.length;i++){
    const ch = bytes[i];
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296*(2097151 & h2)+(h1>>>0)).toString(16);
}

/* ============ EXPORT AS .sql / .json ============ */
function downloadText(text, filename, mime){
  const blob = new Blob([text], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function allTableNames(){
  return q("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").map(r=>r.name);
}
function exportSQL(){
  let out = '-- LF Ops export — ' + new Date().toISOString() + '\n\n';
  allTableNames().forEach(name=>{
    const createStmt = q("SELECT sql FROM sqlite_master WHERE type='table' AND name=?",[name])[0].sql;
    out += createStmt + ';\n';
    const rows = q(`SELECT * FROM ${name}`);
    rows.forEach(r=>{
      const cols = Object.keys(r);
      const vals = cols.map(c=>{
        const v = r[c];
        if(v===null||v===undefined) return 'NULL';
        if(typeof v==='number') return v;
        return `'${String(v).replace(/'/g,"''")}'`;
      });
      out += `INSERT INTO ${name}(${cols.join(',')}) VALUES(${vals.join(',')});\n`;
    });
    out += '\n';
  });
  downloadText(out, `lf-ops-${todayStr()}.sql`, 'application/sql');
}
function exportJSON(){
  const dump = {};
  allTableNames().forEach(name => dump[name] = q(`SELECT * FROM ${name}`));
  downloadText(JSON.stringify(dump, null, 2), `lf-ops-${todayStr()}.json`, 'application/json');
}

/* ============ SAVE / LOAD ============ */
function saveDatabase(){
  const data = db.export();
  const blob = new Blob([data], {type:'application/x-sqlite3'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lf-ops-${todayStr()}.sqlite`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  dirty = false;
  updateDirtyStatus();
}
document.getElementById('loadFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(dirty && !confirm('Loading a file will replace the current in-memory data, and unsaved changes will be lost. Continue?')) { e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const bytes = new Uint8Array(ev.target.result);
      db = new SQLLib.Database(bytes);
      ensureSchemaMigrations();
      dirty = false;
      updateDirtyStatus();
      render();
    }catch(err){
      const looksLikeOffice = /\.(xlsx|xls|csv)$/i.test(file.name);
      if(looksLikeOffice){
        alert(`"${file.name}" looks like a spreadsheet, not a saved database backup.\n\nThis "Load database" button only re-opens a .sqlite file that this app itself saved earlier.\n\nTo bring in spreadsheet data, use the "Bulk Import" tab in the left menu instead.`);
      } else {
        alert('Could not read this file as a database: '+err.message);
      }
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
});

window.addEventListener('beforeunload', function(e){
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});

/* ============ NAV / RENDER ============ */
function buildNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" onclick="goTab('${t.id}')">${t.label}</button>`).join('');
}
function goTab(id){ activeTab = id; editing = {}; render(); }
function render(){
  document.querySelectorAll('#navlist button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===activeTab);
  });
  Object.values(charts).forEach(c=>c && c.destroy && c.destroy());
  charts = {};
  updateDirtyStatus();
  const fn = {
    dashboard: renderDashboard,
    stores: renderStores,
    employees: renderEmployees,
    sales: renderSales,
    audits: renderAudits,
    visits: renderVisits,
    status: renderStatusLog,
    storecontacts: renderStoreContacts,
    soh: renderSoh,
    import: renderImport,
    customfields: renderCustomFields,
  }[activeTab];
  fn();
}

/* ============ OPTION HELPERS ============ */
function storeOptions(sel){
  const stores = q('SELECT id, store_name, store_code FROM stores WHERE active=1 ORDER BY store_name');
  if(!stores.length) return '<option value="">Add a store first</option>';
  return stores.map(s=>`<option value="${s.id}" ${String(sel)===String(s.id)?'selected':''}>${esc(s.store_name)}${s.store_code?' ('+esc(s.store_code)+')':''}</option>`).join('');
}
function employeeOptions(sel, storeId){
  let sql = 'SELECT id, name FROM employees WHERE status!="Exited"';
  const params=[];
  if(storeId){ sql += ' AND store_id=?'; params.push(storeId); }
  sql += ' ORDER BY name';
  const emps = q(sql, params);
  let opts = '<option value="">— none / unstaffed —</option>';
  opts += emps.map(e=>`<option value="${e.id}" ${String(sel)===String(e.id)?'selected':''}>${esc(e.name)}</option>`).join('');
  return opts;
}
function categoryOptions(sel){
  const cats = q('SELECT id,name FROM categories ORDER BY name');
  return cats.map(c=>`<option value="${c.id}" ${String(sel)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('');
}
function storeName(id){ const r=q('SELECT store_name FROM stores WHERE id=?',[id]); return r[0]?r[0].store_name:'—'; }
function empName(id){ if(!id) return '—'; const r=q('SELECT name FROM employees WHERE id=?',[id]); return r[0]?r[0].name:'—'; }
function catName(id){ const r=q('SELECT name FROM categories WHERE id=?',[id]); return r[0]?r[0].name:'—'; }

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const from = daysAgoStr(30), to = todayStr();
  const prevFrom = daysAgoStr(60), prevTo = daysAgoStr(30);

  const cur = q(`SELECT COALESCE(SUM(net_value),0) v, COALESCE(SUM(qty),0) qy FROM daily_sales WHERE sale_date BETWEEN ? AND ?`,[from,to])[0];
  const prev = q(`SELECT COALESCE(SUM(net_value),0) v FROM daily_sales WHERE sale_date BETWEEN ? AND ?`,[prevFrom,prevTo])[0];
  const growth = prev.v>0 ? ((cur.v-prev.v)/prev.v*100) : (cur.v>0?100:0);

  const storesCount = q('SELECT COUNT(*) c FROM stores WHERE active=1')[0].c;
  const empCount = q("SELECT COUNT(*) c FROM employees WHERE status='Active'")[0].c;
  const shrink = q(`SELECT COALESCE(SUM(shrinkage_qty),0) s, COALESCE(SUM(damage_qty),0) d FROM stock_audits WHERE audit_date BETWEEN ? AND ?`,[from,to])[0];

  const staffed = q(`SELECT AVG(sales_value) a, COUNT(*) n FROM counter_visits WHERE staffed=1 AND visit_date BETWEEN ? AND ?`,[from,to])[0];
  const unstaffed = q(`SELECT AVG(sales_value) a, COUNT(*) n FROM counter_visits WHERE staffed=0 AND visit_date BETWEEN ? AND ?`,[from,to])[0];

  const trend = q(`SELECT sale_date d, SUM(net_value) v FROM daily_sales WHERE sale_date BETWEEN ? AND ? GROUP BY sale_date ORDER BY sale_date`,[from,to]);
  const topCats = q(`SELECT c.name n, SUM(s.net_value) v FROM daily_sales s JOIN categories c ON c.id=s.category_id WHERE s.sale_date BETWEEN ? AND ? GROUP BY c.name ORDER BY v DESC LIMIT 8`,[from,to]);

  document.getElementById('main').innerHTML = `
    <h2 class="page-title">Dashboard</h2>
    <p class="page-sub">Last 30 days (${from} to ${to}), compared with the 30 days before that.</p>
    ${storesCount===0 ? `<div class="banner"><b>Nothing entered yet.</b>Start by adding your stores, then employees, then log daily sales and counter visits — the dashboard fills in as data comes in.</div>`:''}
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Net sales (30d)</div><div class="value">₹${fmtN(cur.v)}</div>
        <div class="delta ${growth>=0?'up':'down'}">${growth>=0?'▲':'▼'} ${fmtN(Math.abs(growth),1)}% vs prior 30d</div></div>
      <div class="kpi"><div class="label">Units sold (30d)</div><div class="value">${fmtN(cur.qy)}</div></div>
      <div class="kpi"><div class="label">Active stores</div><div class="value">${storesCount}</div></div>
      <div class="kpi"><div class="label">Active employees</div><div class="value">${empCount}</div></div>
      <div class="kpi"><div class="label">Shrinkage / damage (30d)</div><div class="value">${fmtN(shrink.s+shrink.d)} pcs</div>
        <div class="delta down">${fmtN(shrink.s)} shrinkage &middot; ${fmtN(shrink.d)} damage</div></div>
      <div class="kpi"><div class="label">Avg sale — staffed vs unstaffed</div>
        <div class="value">₹${fmtN(staffed.a||0)} <span style="color:var(--ink-soft);font-size:13px;">vs</span> ₹${fmtN(unstaffed.a||0)}</div>
        <div class="delta ${(staffed.a||0)>=(unstaffed.a||0)?'up':'down'}">per visit, based on ${staffed.n+unstaffed.n} logged visits</div></div>
    </div>
    <div class="panel-flex">
      <div class="panel"><h3>Sales trend</h3><canvas id="chartTrend" height="180"></canvas></div>
      <div class="panel"><h3>Top categories by value</h3><canvas id="chartCats" height="180"></canvas></div>
    </div>
    <div class="panel"><h3>Staffed vs unstaffed counters</h3><canvas id="chartStaff" height="120"></canvas></div>
  `;

  charts.trend = new Chart(document.getElementById('chartTrend'), {
    type:'line',
    data:{ labels: trend.map(r=>r.d), datasets:[{label:'Net sales', data:trend.map(r=>r.v), borderColor:'#8B6F2E', backgroundColor:'rgba(139,111,46,0.12)', fill:true, tension:.25}]},
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });
  charts.cats = new Chart(document.getElementById('chartCats'), {
    type:'bar',
    data:{ labels: topCats.map(r=>r.n), datasets:[{label:'Net value', data:topCats.map(r=>r.v), backgroundColor:'#8B6F2E'}]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}} }
  });
  charts.staff = new Chart(document.getElementById('chartStaff'), {
    type:'bar',
    data:{ labels:['Avg sales value / visit','Avg units sold / visit'],
      datasets:[
        {label:'Staffed', data:[staffed.a||0, (q(`SELECT AVG(qty_sold) a FROM counter_visits WHERE staffed=1 AND visit_date BETWEEN ? AND ?`,[from,to])[0].a)||0], backgroundColor:'#33633F'},
        {label:'Unstaffed', data:[unstaffed.a||0, (q(`SELECT AVG(qty_sold) a FROM counter_visits WHERE staffed=0 AND visit_date BETWEEN ? AND ?`,[from,to])[0].a)||0], backgroundColor:'#96392A'}
      ]},
    options:{ plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}} }
  });
}

function parseDate(val){
  if(val===undefined || val===null || val==='') return null;
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);
  if(typeof val === 'number'){
    try{ const d = XLSX.SSF.parse_date_code(val); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }catch(e){}
  }
  const s = String(val).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function guessColumn(headers, kws){
  const low = headers.map(h=>String(h||'').toLowerCase().trim());
  for(const kw of kws){
    const idx = low.findIndex(h=>h===kw);
    if(idx>=0) return idx;
  }
  for(const kw of kws){
    const idx = low.findIndex(h=>h.includes(kw));
    if(idx>=0) return idx;
  }
  return -1;
}
const lookupCaches = { stores:new Map(), employees:new Map(), categories:new Map() };
function primeCaches(){
  lookupCaches.stores.clear(); lookupCaches.employees.clear(); lookupCaches.categories.clear();
  q('SELECT id,store_name FROM stores').forEach(r=>lookupCaches.stores.set(r.store_name.toLowerCase().trim(), r.id));
  q('SELECT id,name FROM employees').forEach(r=>lookupCaches.employees.set(r.name.toLowerCase().trim(), r.id));
  q('SELECT id,name FROM categories').forEach(r=>lookupCaches.categories.set(r.name.toLowerCase().trim(), r.id));
}
function lookupOrCreate(cache, table, col, value){
  if(value===undefined||value===null) return null;
  const name = String(value).trim();
  if(!name) return null;
  const key = name.toLowerCase();
  if(cache.has(key)) return cache.get(key);
  run(`INSERT INTO ${table}(${col}) VALUES (?)`, [name]);
  const id = q('SELECT last_insert_rowid() id')[0].id;
  cache.set(key, id);
  return id;
}

        ${st.target==='sales' ? `
          <div class="entry-form" style="border-bottom:none;">
            <div class="field chk"><label><input type="checkbox" id="replaceChk" ${st.replace?'checked':''}> Replace existing sales that fall in this file's date range</label></div>
          </div>` : ''}
        <button class="btn btn-brass" onclick="startImport()">Import ${st.rowCount} rows</button>
        <div id="importProgress" class="hint"></div>
      </div>`;
  }

  document.getElementById('main').innerHTML = `
    <h2 class="page-title">Bulk Import</h2>
    <p class="page-sub">Load a CSV or Excel export (your ERP sale/SOH report, or any spreadsheet) and map its columns once — the app remembers nothing between files, so re-check the mapping each time your export format changes.</p>
    <div class="panel">
      <h3>1. What are you importing?</h3>
      <div class="entry-form" style="border-bottom:none;padding-bottom:0;">
        <div class="field">
          <label>Target</label>
          <select onchange="editing.import={target:this.value, asOfDate: todayStr(), replace:true};render();">
            ${Object.keys(IMPORT_TARGETS).map(k=>`<option value="${k}" ${st.target===k?'selected':''}>${IMPORT_TARGETS[k].label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>File (.xlsx, .xls or .csv)</label>
          <input type="file" id="importFile" accept=".xlsx,.xls,.csv">
        </div>
        ${st.sheetNames && st.sheetNames.length>1 ? `
        <div class="field"><label>Sheet</label>
          <select onchange="pickSheet(this.value)">${st.sheetNames.map(s=>`<option ${s===st.sheetName?'selected':''}>${esc(s)}</option>`).join('')}</select>
        </div>`:''}
        ${st.headers ? `
        <div class="field"><label>Header row #</label><input type="number" min="1" value="${st.headerRowIdx+1}" onchange="setHeaderRow(this.value)" style="width:70px;"></div>
        `:''}
      </div>
      <p class="hint">Not sure your file will map cleanly? Download a blank template with the exact column names this app recognises automatically:
        <button class="rowlink" onclick="downloadTemplate('${st.target}')">Download ${targetDef.label} template</button>
      </p>
    </div>
    ${previewHtml}
    ${mappingHtml}
    ${renderImportHistory()}
  `;
  document.getElementById('importFile').addEventListener('change', handleImportFile);
}

function renderImportHistory(){
  const logs = q('SELECT * FROM upload_logs ORDER BY uploaded_at DESC LIMIT 15');
  if(!logs.length) return '';
  return `
    <div class="panel">
      <h3>Import history</h3>
      <table>
        <thead><tr><th>File</th><th>Target</th><th class="num">Added</th><th class="num">Skipped</th><th>When</th></tr></thead>
        <tbody>
        ${logs.map(l=>`<tr><td>${esc(l.file_name)}</td><td>${esc(IMPORT_TARGETS[l.target]?IMPORT_TARGETS[l.target].label:l.target)}</td>
          <td class="num">${fmtN(l.rows_inserted)}</td><td class="num">${fmtN(l.rows_skipped)}</td>
          <td>${esc((l.uploaded_at||'').slice(0,16).replace('T',' '))}</td></tr>`).join('')}
        </tbody>
      </table>
      <p class="hint">Re-uploading a file already listed here will prompt a duplicate warning first.</p>
    </div>`;
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = new Uint8Array(ev.target.result);
      const hash = fingerprintBytes(data);
      const dup = q('SELECT * FROM upload_logs WHERE file_hash=?', [hash]);
      if(dup.length){
        const d = dup[0];
        const proceed = confirm(`This exact file already appears to have been imported on ${d.uploaded_at.slice(0,16).replace('T',' ')} (${d.rows_inserted} rows added, into ${d.target}).\n\nImport it again anyway?`);
        if(!proceed){ e.target.value=''; return; }
      }
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      editing.import.workbook = wb;
      editing.import.fileName = file.name;
      editing.import.fileSize = file.size;
      editing.import.fileHash = hash;
      editing.import.sheetNames = wb.SheetNames;
      pickSheet(wb.SheetNames[0]);
    }catch(err){
      alert('Could not read this file: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
function pickSheet(name){
  const st = editing.import;
  st.sheetName = name;
  const ws = st.workbook.Sheets[name];
  const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
  // auto-detect header row: first row with 3+ non-empty cells
  let headerRowIdx = raw.findIndex(r => r.filter(c=>String(c).trim()!=='').length >= 3);
  if(headerRowIdx < 0) headerRowIdx = 0;
  st.headerRowIdx = headerRowIdx;
  st.allRows = raw;
  applyHeaderRow();
}
function setHeaderRow(n){
  editing.import.headerRowIdx = Math.max(0, Number(n)-1);
  applyHeaderRow();
}
function applyHeaderRow(){
  const st = editing.import;
  st.headers = st.allRows[st.headerRowIdx].map(h=>String(h).trim() || '(blank)');
  st.dataRows = st.allRows.slice(st.headerRowIdx+1).filter(r => r.some(c=>String(c).trim()!==''));
  st.rowCount = st.dataRows.length;
  st.mapping = null;
  render();
}

function startImport(){
  const st = editing.import;
  const targetDef = IMPORT_TARGETS[st.target];
  const mapForm = document.getElementById('mapForm');
  const fd = new FormData(mapForm);
  const mapping = {};
  targetDef.fields.forEach(f => mapping[f.key] = Number(fd.get(f.key)));
  st.mapping = mapping;

  const missingRequired = targetDef.fields.filter(f=>f.required && mapping[f.key]===-1);
  if(missingRequired.length){
    alert('Please map required field(s): ' + missingRequired.map(f=>f.label).join(', '));
    return;
  }
  const asOfDate = document.getElementById('asOfDate') ? document.getElementById('asOfDate').value : null;
  if(st.target==='soh' && !asOfDate){ alert('Please set the stock as-of date.'); return; }
  const replace = document.getElementById('replaceChk') ? document.getElementById('replaceChk').checked : false;

  primeCaches();
  const progressEl = document.getElementById('importProgress');
  const rows = st.dataRows;
  let inserted = 0, skipped = 0;
  const errors = [];

  db.exec('BEGIN');

  if(st.target==='soh' && replace){
    run('DELETE FROM soh_snapshot WHERE snapshot_date=?', [asOfDate]);
  }
  if(st.target==='sales' && replace){
    let minD=null, maxD=null;
    rows.forEach(r=>{ const d=parseDate(r[mapping.sale_date]); if(d){ if(!minD||d<minD) minD=d; if(!maxD||d>maxD) maxD=d; } });
    if(minD && maxD) run('DELETE FROM daily_sales WHERE sale_date BETWEEN ? AND ?', [minD, maxD]);
  }

  let stmt;
  if(st.target==='sales') stmt = db.prepare(`INSERT INTO daily_sales(sale_date,store_id,employee_id,category_id,qty,mrp_value,discount,net_value,remarks) VALUES (?,?,?,?,?,?,?,?,?)`);
  if(st.target==='soh') stmt = db.prepare(`INSERT INTO soh_snapshot(snapshot_date,store_id,category_id,item_code,item_desc,soh_qty,mrp) VALUES (?,?,?,?,?,?,?)`);
  if(st.target==='employees') stmt = db.prepare(`INSERT INTO employees(name,store_id,designation,status) VALUES (?,?,?,?)`);
  if(st.target==='stores') stmt = db.prepare(`INSERT INTO stores(store_name,store_code,area_name,region_name,district_name,store_type) VALUES (?,?,?,?,?,?)`);

  function cell(r, key){ const idx = mapping[key]; return idx===-1||idx===undefined ? '' : r[idx]; }
  function storeId(r){ const v = cell(r,'store_name'); return v ? lookupOrCreate(lookupCaches.stores,'stores','store_name', v) : null; }
  function catId(r){ const v = cell(r,'category'); return v ? lookupOrCreate(lookupCaches.categories,'categories','name', v) : null; }
  function empId(r){ const v = cell(r,'employee_name'); return v ? lookupOrCreate(lookupCaches.employees,'employees','name', v) : null; }

  let i = 0;
  function processChunk(){
    const chunkEnd = Math.min(i+1500, rows.length);
    for(; i<chunkEnd; i++){
      const r = rows[i];
      try{
        if(st.target==='sales'){
          const d = parseDate(cell(r,'sale_date'));
          if(!d){ skipped++; continue; }
          const sId = storeId(r);
          if(!sId){ skipped++; continue; }
          stmt.run([d, sId, empId(r), catId(r), Number(cell(r,'qty'))||0, Number(cell(r,'mrp_value'))||0, Number(cell(r,'discount'))||0, Number(cell(r,'net_value'))||0, String(cell(r,'remarks')||'')]);
        } else if(st.target==='soh'){
          const sId = storeId(r);
          if(!sId){ skipped++; continue; }
          stmt.run([asOfDate, sId, catId(r), String(cell(r,'item_code')||''), String(cell(r,'item_desc')||''), Number(cell(r,'soh_qty'))||0, Number(cell(r,'mrp'))||0]);
        } else if(st.target==='employees'){
          const name = cell(r,'name');
          if(!name){ skipped++; continue; }
          stmt.run([String(name), storeId(r), String(cell(r,'designation')||''), String(cell(r,'status')||'Active')]);
        } else if(st.target==='stores'){
          const name = cell(r,'store_name');
          if(!name){ skipped++; continue; }
          stmt.run([String(name), String(cell(r,'store_code')||''), String(cell(r,'area_name')||''), String(cell(r,'region_name')||''), String(cell(r,'district_name')||''), String(cell(r,'store_type')||'')]);
        }
        inserted++;
      }catch(err){ skipped++; if(errors.length<5) errors.push(err.message); }
    }
    progressEl.textContent = `Importing… ${i} of ${rows.length} rows processed.`;
    if(i < rows.length){
      setTimeout(processChunk, 0);
    } else {
      stmt.free();
      db.exec('COMMIT');
      if(st.fileHash){
        try{
          run(`INSERT OR REPLACE INTO upload_logs(file_name,file_size,file_hash,target,rows_inserted,rows_skipped,uploaded_at) VALUES (?,?,?,?,?,?,?)`,
            [st.fileName, st.fileSize, st.fileHash, st.target, inserted, skipped, new Date().toISOString()]);
        }catch(e){ /* logging is best-effort, don't block the import result */ }
      }
      dirty = true; updateDirtyStatus();
      progressEl.innerHTML = `<b>Done.</b> ${inserted} rows imported, ${skipped} skipped.` +
        (errors.length ? `<br>Sample errors: ${errors.map(esc).join(' | ')}` : '') +
        (skipped ? `<br>Skipped rows are usually missing a required value (e.g. no store name or unreadable date) — check the source file for blank rows.` : '');
    }
  }
  processChunk();
}

function downloadTemplate(target){
  const def = IMPORT_TARGETS[target];
  const headers = def.fields.map(f=>f.label);
  const csv = headers.join(',') + '\n';
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${target}-template.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ============ MANAGE CUSTOM FIELDS ============ */
function renderCustomFields(){
  const e = editing.customfield || {};
  const fields = q('SELECT * FROM custom_fields ORDER BY entity, sort_order, id');
  document.getElementById('main').innerHTML = `
    <h2 class="page-title">Custom Fields</h2>
    <p class="page-sub">Add your own fields to any tab — no coding needed. A new field shows up immediately in that tab's form and table.</p>
    <div class="panel">
      <form class="entry-form" id="cfForm" style="border-bottom:none;">
        <div class="field"><label>Add field to*</label>
          <select required name="entity">${Object.entries(CUSTOM_ENTITIES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Field label*</label><input required name="field_label" placeholder="e.g. PAN Number"></div>
        <div class="field"><label>Field type*</label>
          <select required name="field_type" onchange="document.getElementById('cfOptionsWrap').style.display=this.value==='select'?'flex':'none';">
            <option value="text">Text</option><option value="number">Number</option><option value="date">Date</option><option value="select">Dropdown</option>
          </select>
        </div>
        <div class="field" id="cfOptionsWrap" style="display:none"><label>Dropdown options</label><input name="options" placeholder="comma, separated, values"></div>
        <button class="btn btn-brass" type="submit">Add field</button>
      </form>
      <table>
        <thead><tr><th>Tab</th><th>Field</th><th>Type</th><th></th></tr></thead>
        <tbody>
        ${fields.length?fields.map(f=>`
          <tr><td>${esc(CUSTOM_ENTITIES[f.entity]||f.entity)}</td><td>${esc(f.field_label)}</td>
          <td>${esc(f.field_type)}${f.field_type==='select'?` (${esc(f.options)})`:''}</td>
          <td><button class="rowlink danger" onclick="deleteCustomField(${f.id})">Remove</button></td></tr>`).join(''):
          `<tr><td colspan="4" class="empty">No custom fields yet — add one above.</td></tr>`}
        </tbody>
      </table>
      <p class="hint">Removing a field also permanently deletes any values already entered for it, on every record.</p>
    </div>
  `;
  document.getElementById('cfForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    const f = new FormData(ev.target);
    run('INSERT INTO custom_fields(entity,field_label,field_type,options,sort_order) VALUES (?,?,?,?,0)',
      [f.get('entity'), f.get('field_label'), f.get('field_type'), f.get('options')||'']);
    render();
  });
}
function deleteCustomField(id){
  if(!confirm('Remove this field? Any values already entered for it, on every record, will be deleted too.')) return;
  run('DELETE FROM custom_field_values WHERE field_id=?', [id]);
  run('DELETE FROM custom_fields WHERE id=?', [id]);
  render();
}

/* ============ GENERIC DELETE ============ */
function deleteRow(table, id){
  if(!confirm('Delete this record? This cannot be undone (until you reload a saved backup).')) return;
  run(`DELETE FROM ${table} WHERE id=?`,[id]);
  render();
}
</script>
